name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        check-latest: true

    - name: Vet
      run: go vet ./...

    - name: Unit tests
      run: go test -race -coverpkg=./... ./...

    - name: Vulnerability check
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
