name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# setup-go installs the version of the go directive; the go command then switches to the
# patched toolchain declared in go.mod.
env:
  GOTOOLCHAIN: auto

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod

    - name: Go version
      run: go version

    - name: Vet
      run: go vet ./...

    - name: Unit tests
      run: go test -race -coverpkg=./... ./...

    - name: Vulnerability check
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
